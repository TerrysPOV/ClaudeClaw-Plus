name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ratchet, not a gate (#327). The repo has a pre-existing type-error
      # backlog recorded in `.tsc-baseline`; this fails only if the count
      # GOES UP, so new type errors cannot be introduced while the backlog is
      # paid down separately. A typecheck step would have caught #329's
      # `dedupeKey is not defined` in April and #330's object-into-a-string
      # argument at author time.
      - name: Typecheck (no new type errors)
        run: bun run typecheck

  test:
    name: Bun test (module suites)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # #304: the whole `src` tree. The root `src/__tests__/` suite was excluded
      # for months behind "~41 pre-existing failures"; re-baselined, those were
      # (a) one module mock leaking process-wide out of gateway/index.test.ts —
      # 38 escalation/gateway tests failed in the pack and 0 alone, (b) a
      # fake-claude shell script whose `printf '\xHH'` dash does not support,
      # (c) a test reading the OPERATOR's live plugin-audit journal, and (d) a
      # test depending on whichever policy rules the previous file left
      # loaded. All fixed in place; 0 failures across the tree, twice.
      #
      # Nothing in here may skip on an env var: a test that opts itself out
      # reports green and proves nothing (the shape that let #290 through).
      # Tests that need a real `claude` or credentials live in
      # `tests/integration/` and run from integration.yml — nightly, un-gated,
      # red when they fail.
      - name: Run tests (all of src)
        run: bun test src
