name: Claude Code Review

# Comment-triggered only. Previously ran on every push to a PR (pull_request_target:
# synchronize) for OWNER/MEMBER/COLLABORATOR authors — including Terry's own pushes to
# his own PRs — burning a full review's worth of usage per commit. Changed 2026-09-15:
# now runs only when a trusted user explicitly asks for it.

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: >-
      github.event.issue.pull_request
      && contains(github.event.comment.body, '@claude review')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    # Informational only — transient action infrastructure errors shouldn't block PRs.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # NOTE: `id-token: write` deliberately removed — OIDC is not used here and
      # it needlessly widens the blast radius of this privileged job.

    steps:
      - name: Check token configured
        id: token-check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not configured — skipping review."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # issue_comment carries no PR object, only the issue/PR number — resolve
      # the PR to get its actual base commit. A plain default-branch checkout
      # would silently drift for a PR targeting a non-default branch, or one
      # whose base has advanced since the PR opened: the review command's own
      # diff (fetched separately via `gh`) would then be read against a
      # different commit than the repo context checked out here.
      - name: Resolve PR base commit
        if: steps.token-check.outputs.configured == 'true'
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .base.sha)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR base commit)
        if: steps.token-check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.base_sha }}
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.token-check.outputs.configured == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@fefa07e9c665b7320f08c3b525980457f22f58aa
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number }}'
